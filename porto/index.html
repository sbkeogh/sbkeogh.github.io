<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="0; url=/portugal/porto/">
<title>Moved — Porto Walking Tour</title>
<script>
  // Clean up the old PWA registration at this scope, then follow the redirect.
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function (regs) {
      regs.forEach(function (r) { r.unregister(); });
    });
  }
  location.replace('/portugal/porto/');
</script>
</head>
<body>
<p>The Porto walking tour has moved to
<a href="/portugal/porto/">keogh.ai/portugal/porto/</a>.</p>
</body>
</html>
